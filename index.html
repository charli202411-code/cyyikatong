const baseRecords=[{name:'中心食堂 · 午餐',type:'食堂',amount:16,time:'今天 12:08',icon:'♨'},{name:'中心食堂 · 早餐',type:'食堂',amount:7,time:'今天 07:42',icon:'♨'},{name:'宿舍淋浴',type:'洗澡',amount:3.8,time:'昨天 22:16',icon:'♧'},{name:'直饮水 · 8号楼',type:'饮水',amount:.6,time:'昨天 18:32',icon:'◉'},{name:'兴业苑食堂 · 晚餐',type:'食堂',amount:18,time:'昨天 18:05',icon:'♨'},{name:'中心食堂 · 午餐',type:'食堂',amount:15,time:'10月28日 12:10',icon:'♨'},{name:'超市 · 日用品',type:'其他',amount:42,time:'10月27日 19:03',icon:'▣'},{name:'重复扣款退回',type:'退款',amount:-16,time:'10月26日 14:20',icon:'↩'}];
let state={page:'home',filter:'全部',budget:Number(localStorage.getItem('cqBudget'))||1000,remind:localStorage.getItem('cqRemind')!=='false',rangeStart:initialCycle59().start,rangeEnd:initialCycle59().end,threshold:loadThreshold(),tab:'概览'},history=[];let spent=826.4,average=31.2;let day=Number(campusToday59().slice(-2)),remaining=calendarRemaining59();let money=n=>'¥'+n.toFixed(2),forecast=()=>spent+average*remaining;function go(p){history.push(state.page);state.page=p;render();window.scrollTo(0,0)}function back(){state.page=history.pop()||'home';render()}function toast(s){let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2300)}function modal(html){document.getElementById('modal').innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="dialog">'+html+'<button class="wide link" onclick="closeModal()">关闭</button></div></div>'}function closeModal(){document.getElementById('modal').innerHTML=''}function txn(r,i){return `<button class="transaction" onclick="detail(${i})"><span class="icon">${r.icon}</span><span class="info"><strong>${escapeText(r.name)}</strong><small>${r.date} · ${r.time.startsWith('今天')?r.time.slice(3):r.time.startsWith('昨天')?r.time.slice(3):r.source==='manual'?'':r.time.slice(-5)} · ${r.source==='manual'?'手动录入 · ':''}${r.type}</small></span><strong>${r.amount<0?'+':'−'}${money(Math.abs(r.amount))}</strong></button>`}let selectedTransaction = 0; function detail(i){if(records[i].source==='manual'){manualDetail(i);return;}selectedTransaction=i;let r=records[i];modal(`<h2>交易详情</h2><div class="hero-number" style="font-size:30px">${r.amount<0?'+':'−'}${money(Math.abs(r.amount))}</div><p>${r.name}</p><p class="muted">交易时间：${r.date} ${r.time.slice(-5)}<br>消费分类：${r.type}<br>支付方式：校园卡余额<br>交易状态：${r.amount<0?'退款成功':'交易成功'}</p><button class="primary wide" onclick="feedback()">对此笔交易有疑问</button>`)}function feedback(){
  modal('<h2>交易反馈</h2><p class="muted">' + records[selectedTransaction].name + '</p><label>问题类型<select id="issue"><option>重复扣款</option><option>金额有误</option><option>未获得服务</option><option>其他问题</option></select></label><button class="primary wide" onclick="submitFeedback()">提交反馈</button>');

function readFeedbacks(){
  try { return JSON.parse(localStorage.getItem('cqFeedbacks') || '[]'); } catch(e) { return []; }
}
function submitFeedback(){
  const items=readFeedbacks();
  items.unshift({issue:document.getElementById('issue').value, transaction:selectedTransaction, submitted:campusDateTime59(), status:'已提交'});
  try { localStorage.setItem('cqFeedbacks',JSON.stringify(items)); }
  catch(e) { toast('保存失败，请检查浏览器存储设置后重试'); return; }
  modal('<h2>反馈已提交</h2><p>校园服务人员将核查此笔交易，你可以在“我的反馈”中查看处理进度。</p><p class="muted">当前为交互演示，反馈仅保存在此浏览器。</p><button class="primary wide" onclick="showFeedbacks()">查看我的反馈</button>');
}
function showFeedbacks(){
  const items=readFeedbacks();
  modal('<h2>我的反馈</h2>' + items.map((f,i)=>'<button class="transaction" onclick="showFeedbackDetail('+i+')"><span class="info"><strong>'+escapeText(f.issue)+'</strong><small>'+escapeText(records[f.transaction].name)+'</small><small>'+escapeText(f.submitted)+'</small></span><span class="tag">已提交 ›</span></button>').join('') + '<button class="transaction" onclick="showResolvedFeedback()"><span class="info"><strong>重复扣款</strong><small>中心食堂 · 退款 ¥16.00</small></span><span class="status">已处理 ›</span></button><p class="muted">演示数据 · 新反馈仅保存于当前浏览器</p>');
}
function escapeText(value){
  return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showFeedbackDetail(i){
  const f=readFeedbacks()[i];
  if(!f)return;
  modal('<h2>反馈详情</h2><p>'+escapeText(f.issue)+'</p><p class="muted">关联交易：'+escapeText(records[f.transaction].name)+'<br>提交时间：'+escapeText(f.submitted)+'</p><div class="warning">已提交 → 待核查 → 处理完成<br>当前状态：已提交，等待核查。</div><button class="link wide" onclick="showFeedbacks()">返回反馈列表</button>');
}
function showResolvedFeedback(){
  modal('<h2>反馈详情</h2><p>重复扣款 · 已处理</p><p class="muted">核查结果：确认重复扣款，¥16.00 已退回校园卡余额。</p><button class="primary wide" onclick="detail(7)">查看退款交易</button><button class="link wide" onclick="showFeedbacks()">返回反馈列表</button>');

function budget(){modal(`<h2>修改月度预算</h2><p class="muted">2026年10月 · 一卡通＋手动支出预算</p><label>预算金额（元）<input id="budgetInput" type="number" min="1" max="100000" value="${state.budget}"></label><button class="primary wide" onclick="saveBudget()">保存预算</button>`)}function saveBudget(){let v=Number(document.getElementById('budgetInput').value);if(!Number.isFinite(v)||v<=0||v>100000){toast('请输入1至100000元的预算');return}state.budget=v;localStorage.setItem('cqBudget',v);closeModal();render();toast('预算已更新')}function loadThreshold(){
  const raw=localStorage.getItem('cqThreshold');
  const value=Number(raw);
  return raw!==null && raw.trim()!=='' && Number.isInteger(value) && value>=0 && value<=100 ? value : 85;
}
function thresholdDescription(){
  return '当本月消费达到预算的 '+state.threshold+'%（'+money(state.budget*state.threshold/100)+'）时提醒。'+(state.threshold===0?'0% 表示从预算周期开始提醒。':state.threshold===100?'100% 表示预算用尽时提醒。':'');
}
function updateThreshold(raw,commit){
  const value=Number(raw);
  const valid=String(raw).trim()!=='' && Number.isInteger(value) && value>=0 && value<=100;
  const status=document.getElementById('thresholdStatus');
  if(!valid){
    status.textContent='请输入 0 至 100 之间的整数';
    if(commit) document.getElementById('thresholdNumber').value=state.threshold;
    return;
  }
  state.threshold=value;
  document.getElementById('thresholdNumber').value=value;
  document.getElementById('thresholdRange').value=value;
  document.getElementById('thresholdDescription').textContent=thresholdDescription();
  localStorage.setItem('cqThreshold',String(value));
  status.textContent='已保存：'+value+'%';
}


function loadLimit(key,amount){
  try {
    const saved=JSON.parse(localStorage.getItem(key));
    if(saved && typeof saved.enabled==='boolean' && Number.isFinite(saved.amount) && saved.amount>0 && saved.amount<=100000)
      return {enabled:saved.enabled,amount:Math.round(saved.amount*100)/100};
  }catch(e){}
  return {enabled:false,amount:amount};
}
const spendingLimits={daily:loadLimit('cqDailyLimit',50),single:loadLimit('cqSingleLimit',100)};
function limitKey(kind){return kind==='daily'?'cqDailyLimit':'cqSingleLimit';}
function todaySpent(){return records.filter(r=>r.time.startsWith('今天') && r.amount>0).reduce((sum,r)=>sum+r.amount,0);}
function limitName(kind){return kind==='daily'?'每日预算限制':'单笔最大支出限制';}
function limitsPanel(){
  return '<section class="section"><h2>支出限制</h2>'+['daily','single'].map(kind=>{
    const limit=spendingLimits[kind];
    return '<div class="panel"><div class="row"><h3>'+limitName(kind)+'</h3><input type="checkbox" aria-label="开启'+limitName(kind)+'" '+(limit.enabled?'checked':'')+' onchange="toggleLimit(\''+kind+'\',this.checked)"></div><button type="button" class="limit-amount row" aria-label="设置'+limitName(kind)+'金额" onclick="editLimit(\''+kind+'\')"><strong>'+money(limit.amount)+'</strong><span class="link">修改 ›</span></button><p class="muted">'+(kind==='daily'?'每天累计支出达到限额后，阻止继续支出；次日重新计算。':'超过该金额的单笔支出将被阻止，等于限额时可继续。')+'</p>'+(kind==='daily'?'<div class="row muted"><span>今日已支出 '+money(dailyOutflow())+'</span><span>'+(limit.enabled?'今日剩余 '+money(Math.max(0,limit.amount-dailyOutflow())):'未开启')+'</span></div>':'<span class="muted">'+(limit.enabled?'已开启':'未开启')+'</span>')+'</div>';
  }).join('')+'<p class="muted">两项限制独立设置，同时开启时，需同时满足才能支出。修改限额即时生效。</p><button type="button" class="link wide" onclick="previewPayment()">试算一笔支出 ›</button></section>';
}
function toggleLimit(kind,enabled){
  const previous=spendingLimits[kind].enabled;
  spendingLimits[kind].enabled=enabled;
  try{localStorage.setItem(limitKey(kind),JSON.stringify(spendingLimits[kind]));}
  catch(e){spendingLimits[kind].enabled=previous;render();toast('保存失败，请重试');return;}
  render();toast(limitName(kind)+(enabled?'已开启':'已关闭'));
}
function editLimit(kind){
  modal('<h2>'+limitName(kind)+'</h2><form id="limitForm"><label for="limitAmount">限额（元）</label><input id="limitAmount" aria-label="限制金额" type="text" inputmode="decimal" autocomplete="off" value="'+spendingLimits[kind].amount+'"><p class="muted">支持 0.01—100000 元，最多两位小数。</p><p id="limitError" class="limit-error" role="alert"></p><button type="submit" class="primary wide">保存限额</button></form>');
  document.getElementById('limitForm').addEventListener('submit',event=>{event.preventDefault();saveLimit(kind);});
  document.getElementById('limitAmount').focus();document.getElementById('limitAmount').select();
}
function validAmount(raw){return /^\d+(?:\.\d{1,2})?$/.test(raw) && Number(raw)>0 && Number(raw)<=100000;}
function saveLimit(kind){
  const raw=document.getElementById('limitAmount').value.trim();
  if(!validAmount(raw)){document.getElementById('limitError').textContent='请输入 0.01 至 100000 元，最多两位小数';return;}
  const next={...spendingLimits[kind],amount:Number(raw)};
  try{localStorage.setItem(limitKey(kind),JSON.stringify(next));}
  catch(e){document.getElementById('limitError').textContent='保存失败，请重试';return;}
  spendingLimits[kind]=next;closeModal();render();toast('限额已保存'+(next.enabled?'':'，开启后生效'));
}
function previewPayment(){
  modal('<h2>支出限制试算</h2><p class="muted">输入金额查看是否满足当前限额，试算不会扣款或新增交易。</p><form id="previewForm"><label for="previewAmount">本次支出（元）</label><input id="previewAmount" type="text" inputmode="decimal" autocomplete="off" value="20"><button type="submit" class="primary wide">检查是否可支出</button></form><div id="previewResult" role="status" aria-live="polite"></div>');
  document.getElementById('previewForm').addEventListener('submit',event=>{event.preventDefault();checkPayment();});

function checkPayment(){
  const raw=document.getElementById('previewAmount').value.trim();
  const output=document.getElementById('previewResult');
  if(!validAmount(raw)){output.textContent='请输入 0.01 至 100000 元，最多两位小数';return;}
  const cents=Math.round(Number(raw)*100),reasons=[];
  if(spendingLimits.single.enabled && cents>Math.round(spendingLimits.single.amount*100)) reasons.push('超过单笔最大支出限制 '+money(spendingLimits.single.amount));
  if(spendingLimits.daily.enabled && Math.round(dailyOutflow()*100)+cents>Math.round(spendingLimits.daily.amount*100)) reasons.push('超过每日预算限制 '+money(spendingLimits.daily.amount)+'，今日剩余 '+money(Math.max(0,spendingLimits.daily.amount-dailyOutflow())));
  output.innerHTML=reasons.length?'<div class="warning" style="margin-top:16px"><strong>本次支出将被阻止</strong><br>'+reasons.join('<br>')+'</div><button class="link wide" onclick="closeModal();go(\'budget\')">调整支出限制</button>':'<p class="status">本次支出符合限制，可以继续。</p>';
}


let demoDate=campusToday59();

    return Array.isArray(data)?data.filter(e=>e && typeof e.id==='string' && typeof e.name==='string' && e.name.trim() && Number.isFinite(e.amount) && e.amount>0 && e.amount<=100000 && validExpenseDate(e.date)):[];

function validExpenseDate(value){return typeof value==='string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && value>='2000-01-01' && value<=demoDate && !isNaN(Date.parse(value)) && new Date(value+'T12:00:00Z').toISOString().slice(0,10)===value;}

baseRecords.forEach((r,i)=>{r.date=dateShift59(sampleAnchor59,-[0,0,1,1,1,2,3,4][i]);r.time=timeText59(r.time);r.example59=true;});
const historyCategories=[['食堂',64120,''],['洗澡',6460,''],['饮水',2420,''],['其他',1000,'']];
historyCategories.forEach(([type,total,icon])=>{const count=type==='食堂'?23:6;for(let i=0;i<count;i++){
  const date=dateShift59(sampleAnchor59,-5-Math.floor(i*23/count));
  const cents=Math.floor(total/count)+(i<total%count?1:0);
  baseRecords.push({name:type+'消费（示例）',type,amount:cents/100,date,time:'12:00:00',icon,example59:true});
}});
if(accountMode59==='blank')baseRecords.length=0;

let manualExpenses=loadManualExpenses(),records=[];
function expenseTime(date){return date===demoDate?'今天':date===shiftDate(demoDate,-1)?'昨天':date;}
function monthlyManual(){return manualExpenses.filter(e=>e.date.startsWith(demoDate.slice(0,7)));}
function manualTotal(){return monthlyManual().reduce((sum,e)=>sum+Math.round(e.amount*100),0)/100;}
function refreshExpenseStats(){
  records=baseRecords.concat(manualExpenses.map(e=>({...e,type:'其他',source:'manual',time:expenseTime(e.date),icon:'✎'})));
  spent=records.filter(isCurrentMonth).reduce((sum,r)=>sum+Math.round(r.amount*100),0)/100;
  average=31.2+manualExpenses.filter(e=>e.date>='2026-10-24' && e.date<=demoDate).reduce((sum,e)=>sum+e.amount,0)/7;
}
function isCurrentMonth(r){return r.date>=monthStart59(demoDate)&&r.date<=demoDate;}
function recentRecords(){
 return records.map((r,i)=>({r,i})).filter(({r})=>isCurrentMonth(r)).sort((a,b)=>{
   const dateOf=r=>r.date||(r.time.startsWith('今天')?demoDate:r.time.startsWith('昨天')?'2026-10-29':'2026-10-'+(r.time.match(/10月(\d+)日/)||['','26'])[1].padStart(2,'0'));
   return dateOf(b.r).localeCompare(dateOf(a.r))||b.i-a.i;

function isValidRangeDate(value){

refreshExpenseStats=function(){
 refreshBeforeServices();
 records=records.concat(campus.operations.filter(o=>o.kind==='expense').map(o=>({name:o.name,amount:o.cents/100,date:o.date,time:'今天 '+o.time,type:o.category,source:'campus',icon:o.category==='食堂'?'♨':'▣',operationId:o.id})));
 spent=records.filter(isCurrentMonth).reduce((sum,r)=>sum+Math.round(r.amount*100),0)/100;
 average=31.2+records.filter(r=>(r.source==='manual'||r.source==='campus')&&r.date>='2026-10-24'&&r.date<=demoDate).reduce((sum,r)=>sum+r.amount,0)/7;
};

function qrGraphic(){
 let cells='';
 for(let y=0;y<21;y++)for(let x=0;x<21;x++){
  const corner=(x<7&&y<7)?[0,0]:(x>=14&&y<7)?[14,0]:(x<7&&y>=14)?[0,14]:null;
  let fill;if(corner){let a=x-corner[0],b=y-corner[1];fill=a===0||a===6||b===0||b===6||(a>=2&&a<=4&&b>=2&&b<=4);}else fill=((x*17+y*13+qrVersion*7+x*y)%11)<5;
  if(fill)cells+='<rect x="'+(x+2)+'" y="'+(y+2)+'" width="1" height="1"/>';
 }
 return '<svg viewBox="0 0 25 25" class="demo-qr" role="img" aria-label="演示码，不可用于真实支付"><rect width="25" height="25" fill="white"/><g fill="#16374b">'+cells+'</g></svg>';
}

function readServiceAmount(id){const raw=document.getElementById(id).value.trim();if(!validAmount(raw)){toast('请输入0.01至100000元，最多两位小数');return null;}return Math.round(Number(raw)*100);}
function dailyOutflow(){return todaySpent()+campus.operations.filter(o=>o.kind==='transfer'&&o.date===demoDate).reduce((sum,o)=>sum+o.cents/100,0);}
function debitProblems(cents){
 refreshExpenseStats();const reasons=[];
 
 if(cents>campus.balance)reasons.push('校园卡余额不足，请先充值');
 if(spendingLimits.single.enabled&&cents>Math.round(spendingLimits.single.amount*100))reasons.push('超过单笔最大支出限制 '+money(spendingLimits.single.amount));
 const todayOut=dailyOutflow();
 if(spendingLimits.daily.enabled&&Math.round(todayOut*100)+cents>Math.round(spendingLimits.daily.amount*100))reasons.push('超过每日预算限制，今日已支出 '+money(todayOut));
 return reasons;
}
function blocked(reasons){modal('<h2>暂时无法完成</h2><div class="warning">'+reasons.map(escapeText).join('<br>')+'</div>'+serviceButton('调整预算限额',"closeModal();go('budget')")+serviceButton('余额充值',"service('余额充值')",false));}
function operation(kind,name,cents,category='其他',extra={}){
 if(kind==='expense'||kind==='transfer'){const problems=debitProblems(cents);if(problems.length){blocked(problems);return null;}}
 const op={id:'CQ'+Date.now()+Math.random().toString(36).slice(2,6),date:demoDate,time:campusTime59(),kind,name,cents,category,...extra};
 const incoming=kind==='recharge'||kind==='receive';
 const next={...campus,balance:campus.balance+(incoming?cents:-cents),operations:campus.operations.concat(op)};
 if(!saveCampus(next))return null;
 refreshExpenseStats();return op;
}
function receipt(op,title){if(!op)return;closeModal();serviceReceipt={...op,title};render();window.scrollTo(0,0);}
function confirmDemo(title,description,action){modal('<h2>'+title+'</h2><p>'+escapeText(description)+'</p><p class="muted">仅操作模拟校园账户。</p><button id="confirmServiceAction" class="primary wide">确认</button>');document.getElementById('confirmServiceAction').onclick=()=>{closeModal();action();};}
function openMerchant(name,category){state.merchant=name;state.merchantCategory=category;service('商户付款');}
function submitMerchant(){const cents=readServiceAmount('payAmount');if(cents===null)return;confirmDemo('确认付款',state.merchant+' · '+money(cents/100),()=>receipt(operation('expense',state.merchant,cents,state.merchantCategory),'付款成功'));}
function submitRecharge(){const cents=readServiceAmount('rechargeAmount');if(cents===null)return;const channel=document.getElementById('rechargeChannel').value;confirmDemo('确认充值',channel+'充值 '+money(cents/100),()=>receipt(operation('recharge',channel+'充值',cents),'充值成功'));}
function submitReceive(){const cents=readServiceAmount('receiveAmount');if(cents===null)return;confirmDemo('确认模拟收款','模拟收到 '+money(cents/100),()=>receipt(operation('receive','校园卡收款',cents),'收款成功'));}
function confirmCardStatus(){

function saveProfile(){const phone=document.getElementById('profilePhone').value.trim();if(!/^1\d{10}$/.test(phone)){toast('请输入11位手机号码');return;}if(saveCampus({...campus,profile:{...campus.profile,phone}})){render();toast('联系方式已保存');}}
function prepareTransfer(){
 const recipient=document.getElementById('recipient').value.trim(),cents=readServiceAmount('transferAmount'),note=document.getElementById('transferNote').value.trim();
 if(cents===null)return;if(!/^\d{6,12}$/.test(recipient)){toast('请输入6至12位数字学号');return;}if(recipient===campus.profile.student){toast('不能向本人转账');return;}
 confirmDemo('确认收款人','演示同学（'+recipient+'） · '+money(cents/100)+(note?' · '+note:''),()=>receipt(operation('transfer','转账至 '+recipient,cents,'其他',{note,recipient}),'转账成功'));
}
function openBill(name){state.bill=name;service('缴费订单');}
function submitBill(){
 const account=document.getElementById('billAccount').value.trim(),plan=document.getElementById('billPlan').value;
 if(!/^[A-Za-z0-9]{4,20}$/.test(account)){toast('请输入4至20位账号');return;}
 const cents=Number(plan.match(/(\d+)元/)[1])*100;
 confirmDemo('确认缴费',plan+' · 账号 '+account,()=>receipt(operation('expense',state.bill+' · '+account,cents,'其他',{bill:true,plan}),'缴费成功'));
}

 const seed=billsOnly?[]:baseRecords.map((r,i)=>({id:'seed-'+i,name:r.name,amount:Math.abs(r.amount),incoming:r.amount<0,kind:r.amount<0?'refund':'expense',date:r.date,time:r.time,bill:false}));

function exportExpenses(){
 const start=document.getElementById('exportStart').value,end=document.getElementById('exportEnd').value;
 if(!isValidRangeDate(start)||!isValidRangeDate(end)||start>end){toast('请选择有效日期，开始日不能晚于结束日');return;}
 const csvEscape=value=>'"'+String(value).replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';
 const rows=[['日期','用途','金额（元）','分类','来源']].concat(records.filter(r=>r.date>=start&&r.date<=end).map(r=>[r.date,r.name,r.amount.toFixed(2),r.type,r.source==='manual'?'手动录入':'一卡通']));
 const url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(row=>row.map(csvEscape).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='消费账单_'+start+'_'+end+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('账单已导出');

 }

};
// Upcoming arrangements replace daily estimates or add a one-time expense.
function shiftDate(date,days){const value=new Date(date+'T12:00:00Z');value.setUTCDate(value.getUTCDate()+days);return value.toISOString().slice(0,10);}
function forecastMonthEnd(){const [year,month]=demoDate.split('-').map(Number);return shiftDate(new Date(Date.UTC(year,month,1,12)).toISOString().slice(0,10),-1);}
function validPlanAmount(raw,allowZero=false){return /^\d+(?:\.\d{1,2})?$/.test(String(raw))&&Number.isFinite(Number(raw))&&Number(raw)>=(allowZero?0:.01)&&Number(raw)<=100000;}
function loadForecastPlans(){
 try{const saved=JSON.parse(localStorage.getItem('cqForecastPlans')||'[]');return Array.isArray(saved)?saved.filter(p=>p&&typeof p.id==='string'&&['trip','once'].includes(p.kind)&&isValidRangeDate(p.start)&&isValidRangeDate(p.end)&&p.start<=p.end&&Number.isFinite(p.amount)&&validPlanAmount(p.amount,p.kind==='trip')):[];}catch(e){return [];}
}
let forecastPlans=loadForecastPlans();
function futureDays(){const days=[];for(let d=shiftDate(demoDate,1);d<=forecastMonthEnd();d=shiftDate(d,1))days.push(d);return days;}
function forecastBreakdown(){
 const days=futureDays(),active=forecastPlans.filter(p=>p.enabled!==false);
 let usualDays=0,tripDays=0,tripAmount=0;
 for(const date of days){const trip=active.find(p=>p.kind==='trip'&&p.start<=date&&p.end>=date);if(trip){tripDays++;tripAmount+=Math.round(trip.amount*100);}else usualDays++;}
 const extra=active.filter(p=>p.kind==='once'&&p.start>demoDate&&p.start<=forecastMonthEnd()).reduce((sum,p)=>sum+Math.round(p.amount*100),0);
 const usual=Math.round(average*100)*usualDays;
 return {usualDays,tripDays,tripAmount:tripAmount/100,usualAmount:usual/100,extra:extra/100,total:Math.round(spent*100+usual+tripAmount+extra)/100};
}
forecast=()=>forecastBreakdown().total;
const refreshBeforePlans=refreshExpenseStats;
refreshExpenseStats=function(){refreshBeforePlans();const start=shiftDate(demoDate,-6);average=records.filter(r=>r.date>=start&&r.date<=demoDate&&r.amount>0).reduce((sum,r)=>sum+Math.round(r.amount*100),0)/700;};
function saveForecastPlans(next){try{localStorage.setItem('cqForecastPlans',JSON.stringify(next));forecastPlans=next;return true;}catch(e){toast('保存失败，请重试');return false;}}
function planDaysThisMonth(plan){return futureDays().filter(d=>d>=plan.start&&d<=plan.end).length;}
function planRows(){
 if(!forecastPlans.length)return '<div class="empty">暂无安排，按近期日常消费估算。<br>你可以添加外出安排或一次性支出。</div>';
 return forecastPlans.map(p=>{
 const included=p.enabled!==false&&(p.kind==='trip'?planDaysThisMonth(p)>0:p.start>demoDate&&p.start<=forecastMonthEnd());
 const detail=p.kind==='trip'?p.start+' 至 '+p.end+'<br>预计每日 '+money(p.amount)+' · 本月剩余周期内 '+planDaysThisMonth(p)+' 天':p.start+' · 一次性 '+money(p.amount);
 return '<div class="panel"><div class="row"><h3>'+escapeText(p.name)+'</h3><input type="checkbox" aria-label="计入预测 '+escapeText(p.name)+'" '+(p.enabled!==false?'checked':'')+' data-plan-toggle="'+p.id+'"></div><p class="muted">'+detail+'</p><div class="row"><span class="'+(included?'status':'muted')+'">'+(included?'已计入本月预测':p.enabled===false?'已暂停计入预测':'不在本月剩余日期内')+'</span><div><button class="link" data-plan-edit="'+p.id+'">编辑</button><button class="link" style="color:#bd3c33" data-plan-delete="'+p.id+'">删除</button></div></div></div>';
 }).join('');
}
function renderForecastPlans(){
 const b=forecastBreakdown();
 return '<span class="muted">2026年10月 · 月底消费预测</span><h1>这个月，预算够用吗？</h1><div class="panel"><span class="muted">预计月底累计消费</span><div class="hero-number" id="planForecastTotal">'+money(b.total)+'</div><div class="'+(b.total>state.budget?'warning':'status')+'">'+(b.total>state.budget?'预计超出预算 '+money(b.total-state.budget):'预计预算结余 '+money(state.budget-b.total))+'</div></div><section class="section"><h2>预测怎么算？</h2><div class="panel"><div class="legend"><span>本月已消费</span><strong>'+money(spent)+'</strong></div><div class="legend"><span>正常日期 · '+b.usualDays+'天 × '+money(average)+'</span><strong>'+money(b.usualAmount)+'</strong></div><div class="legend"><span>外出日期 · '+b.tripDays+'天</span><strong>'+money(b.tripAmount)+'</strong></div><div class="legend"><span>聚餐／购物等一次性支出</span><strong>'+money(b.extra)+'</strong></div></div><p class="muted">已消费 ＋ 正常日期预计支出 ＋ 外出日期预计支出 ＋ 一次性支出。近7天实际支出日均为 '+money(average)+'，包含一卡通和手动记录，不含退款。外出日使用你填写的金额替换正常日均，一次性支出只加一次。</p></section><section class="section"><h2>接下来有什么安排？</h2><div class="actions plan-actions"><button onclick="editForecastPlan(\'trip\')"><span class="symbol">⌂</span>回家／外出</button><button onclick="editForecastPlan(\'once\')"><span class="symbol">＋</span>聚餐／购物</button></div><p class="muted">演示日期 '+demoDate+'，预测明日至月底的剩余支出。跨月安排只计入本月剩余日期。</p>'+planRows()+'<p class="muted">计划不会加入实际消费，也不会扣款。发生实际支出后，请暂停对应的一次性计划并记账，避免重复预测。</p></section><button class="primary wide" onclick="budget()">调整月度预算</button><button class="link wide" onclick="go(\'overview\')">查看实际消费 ›</button>';
}
function editForecastPlan(kind,id){
 const p=forecastPlans.find(p=>p.id===id),tomorrow=shiftDate(demoDate,1);
 const trip=kind==='trip';
 modal('<h2>'+(trip?'回家／外出安排':'聚餐／购物计划')+'</h2><form id="forecastPlanForm">'+serviceField('planName',trip?'安排名称':'支出用途','','text','maxlength="50" placeholder="'+(trip?'例如：周末回家':'例如：同学聚餐')+'"')+serviceField('planStart',trip?'开始日期':'预计支出日期',p?p.start:tomorrow,'date','min="'+tomorrow+'"')+(trip?serviceField('planEnd','结束日期',p?p.end:tomorrow,'date','min="'+tomorrow+'"'):'')+serviceField('planAmount',trip?'预计每日支出（元）':'一次性支出金额（元）','','text','inputmode="decimal" placeholder="请填写预计金额"')+'<p class="muted">'+(trip?'每日支出可填0，包含在外期间你预计的全部日常支出，将替换这些日期的正常日均。':'该金额为日常支出以外的额外开销，只计入一次，不会乘以剩余天数。')+'</p><p id="planError" class="limit-error" role="alert"></p><button type="submit" class="primary wide">保存安排</button></form>');

 document.getElementById('forecastPlanForm').addEventListener('submit',e=>{e.preventDefault();submitForecastPlan(kind,id);});
}
function submitForecastPlan(kind,id){
 const name=document.getElementById('planName').value.trim(),start=document.getElementById('planStart').value,end=kind==='trip'?document.getElementById('planEnd').value:start,raw=document.getElementById('planAmount').value.trim(),error=document.getElementById('planError');
 if(!name||name.length>50){error.textContent='请填写1至50个字的安排名称';return;}
 if(!isValidRangeDate(start)||!isValidRangeDate(end)||start<=demoDate||end<start){error.textContent='请选择明日或之后的日期，结束日期不能早于开始日期';return;}
 if(!validPlanAmount(raw,kind==='trip')){error.textContent=kind==='trip'?'请输入0至100000元，最多两位小数':'请输入0.01至100000元，最多两位小数';return;}
 if(kind==='trip'&&forecastPlans.some(p=>p.id!==id&&p.kind==='trip'&&p.enabled!==false&&p.start<=end&&p.end>=start)){error.textContent='日期与已有外出安排重叠，请调整日期或暂停原安排';return;}
 const old=forecastPlans.find(p=>p.id===id),p={id:id||'plan-'+Date.now()+'-'+Math.random().toString(36).slice(2),kind,name,start,end,amount:Number(raw),enabled:old?old.enabled:true};
 if(saveForecastPlans(id?forecastPlans.map(e=>e.id===id?p:e):forecastPlans.concat(p))){closeModal();render();toast('安排已保存，预测已更新');}
}
document.getElementById('main').addEventListener('change',event=>{
 const id=event.target.dataset.planToggle;if(!id)return;
 const p=forecastPlans.find(p=>p.id===id);if(!p)return;
 if(event.target.checked&&p.kind==='trip'&&forecastPlans.some(e=>e.id!==id&&e.enabled!==false&&e.kind==='trip'&&e.start<=p.end&&e.end>=p.start)){event.target.checked=false;toast('与已有外出安排重叠，请先修改日期');return;}
 if(saveForecastPlans(forecastPlans.map(e=>e.id===id?{...e,enabled:event.target.checked}:e)))render();
});
document.getElementById('main').addEventListener('click',event=>{

 if(edit){const p=forecastPlans.find(p=>p.id===edit.dataset.planEdit);if(p)editForecastPlan(p.kind,p.id);}
 if(remove){const id=remove.dataset.planDelete;modal('<h2>删除这项安排？</h2><p>删除后将重新计算月底预测，实际消费记录不受影响。</p><button class="primary wide" id="confirmPlanDelete">确认删除安排</button>');document.getElementById('confirmPlanDelete').onclick=()=>{if(saveForecastPlans(forecastPlans.filter(p=>p.id!==id))){closeModal();render();toast('安排已删除，预测已更新');}};}
});
const renderBeforePlans=render;
render=function(){renderBeforePlans();if(state.page==='forecast')document.getElementById('main').innerHTML=renderForecastPlans();};

render();

function exportRows(start,end){
 refreshExpenseStats();
 return records.filter(r=>r.date>=start&&r.date<=end).slice().sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)).map(r=>[r.date,r.name,Math.round(r.amount*100)/100,r.type,r.source==='manual'?'手动录入':'一卡通']);
}
function downloadBill(blob,filename){
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
async function buildExcelBill(rows){
 const zip=await JSZip.loadAsync(billTemplateBase64,{base64:true});
 const path='xl/worksheets/sheet1.xml',ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
 const doc=new DOMParser().parseFromString(await zip.file(path).async('string'),'application/xml');
 if(doc.querySelector('parsererror'))throw new Error('Invalid worksheet template');
 const root=doc.documentElement,sheetData=doc.getElementsByTagNameNS(ns,'sheetData')[0];
 const sample=[...sheetData.children].find(r=>r.getAttribute('r')==='2');
 const styles=[...sample.children].map(c=>c.getAttribute('s'));
 const create=name=>doc.createElementNS(ns,'x:'+name);
 while(sheetData.children.length>1)sheetData.removeChild(sheetData.lastElementChild);
 rows.forEach((data,i)=>{
   const row=create('row');row.setAttribute('r',String(i+2));row.setAttribute('customHeight','1');
   const textUnits=[...data[1]].reduce((sum,c)=>sum+(c.charCodeAt(0)>255?2:1),0);
   row.setAttribute('ht',String(Math.max(28,Math.ceil(textUnits/48)*18+10)));
   data.forEach((value,j)=>{
     const cell=create('c');cell.setAttribute('r','ABCDE'[j]+(i+2));cell.setAttribute('s',styles[j]);
     if(j===0||j===2){
       cell.setAttribute('t','n');const v=create('v');
       v.textContent=j===0?String(Math.round((Date.parse(value+'T00:00:00Z')-Date.UTC(1899,11,30))/86400000)):Number(value).toFixed(2);
       cell.appendChild(v);
     }else{
       cell.setAttribute('t','inlineStr');const inline=create('is'),t=create('t');t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');
       t.textContent=String(value).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'�');inline.appendChild(t);cell.appendChild(inline);
     }
     row.appendChild(cell);
   });
   sheetData.appendChild(row);
 });
 // Keep a filter and explicit used range for Excel and WPS.
 const last=rows.length+1;
 let dimension=doc.getElementsByTagNameNS(ns,'dimension')[0];
 if(!dimension){dimension=create('dimension');root.insertBefore(dimension,root.firstChild);}dimension.setAttribute('ref','A1:E'+last);
 let filter=doc.getElementsByTagNameNS(ns,'autoFilter')[0];
 if(!filter){filter=create('autoFilter');root.insertBefore(filter,sheetData.nextSibling);}filter.setAttribute('ref','A1:E'+last);
 zip.file(path,new XMLSerializer().serializeToString(doc));
 return zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
exportExpenses=async function(format='xlsx'){
 const start=document.getElementById('exportStart').value,end=document.getElementById('exportEnd').value;
 if(!isValidRangeDate(start)||!isValidRangeDate(end)||start>end){toast('请选择有效日期，开始日不能晚于结束日');return;}
 if(exportExpenses.busy)return;
 const status=document.getElementById('exportStatus');exportExpenses.busy=true;
 if(status)status.textContent='正在生成账单…';
 try{
   const rows=exportRows(start,end),filename='消费账单_'+start+'_'+end;
   if(format==='csv'){
     const escape=value=>typeof value==='number'?value.toFixed(2):'"'+String(value).replace(/^\s*[=+@\-]/,"'$&").replace(/"/g,'""')+'"';
     const content=[['日期','用途','金额（元）','分类','来源'],...rows].map(row=>row.map(escape).join(',')).join('\r\n');
     downloadBill(new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'}),filename+'.csv');
   }else downloadBill(await buildExcelBill(rows),filename+'.xlsx');
   if(status)status.textContent='已生成 '+rows.length+' 笔记录的账单';toast('账单已导出');
 }catch(e){if(status)status.textContent='导出失败，请重试';toast('账单导出失败，请重试');}
 finally{exportExpenses.busy=false;}
};

</script><script>

let selectedRechargeId=null,selectedWaterTicketId=null;
const recoveryTime=()=>demoDate+' '+campusTime59();

function rechargeList(){return '<h1>充值到账追踪</h1><p class="muted">支付成功不等于已入账；只有“已到账”才会增加校园卡余额。</p><div class="panel row"><span>当前校园卡余额</span><strong>'+money(campus.balance/100)+'</strong></div>'+

function rechargeDetail(){

 serviceButton('全部充值订单',"service('充值到账追踪')",false)+demoFooter();
}
submitRecharge=function(){
 const cents=readServiceAmount('rechargeAmount');if(cents===null)return;
 const channel=document.getElementById('rechargeChannel').value,scenario=document.getElementById('rechargeScenario')?.value||'正常到账';
 const existing=unresolvedRecharges().find(o=>o.cents===cents);
 const create=()=>confirmDemo('确认充值',channel+'充值 '+money(cents/100),()=>{
   const now=recoveryTime(),id=recoveryId('RC'),order={id,cents,channel,status:'processing',created:now,inquiry:false,events:[{label:'订单已创建',time:now},{label:'支付成功',time:now},{label:'校园卡入账中',time:now}]};
   if(!saveCampus({...campus,recharges:campus.recharges.concat(order)}))return;
   selectedRechargeId=id;
   if(scenario==='正常到账')advanceRecharge('credited',false);
   else if(scenario==='入账失败并退款')advanceRecharge('refund_pending',false);
   openRechargeOrder(id);
 });
 if(existing){
   modal('<h2>有同金额的待处理订单</h2><p>'+money(cents/100)+' 的充值尚未处理完成。先查看原订单，可避免重复付款。</p><button id="viewExistingRecharge" class="primary wide">查看原订单</button><button id="newRechargeAnyway" class="link wide">仍需另充一笔</button>');
   document.getElementById('viewExistingRecharge').onclick=()=>openRechargeOrder(existing.id);
   document.getElementById('newRechargeAnyway').onclick=create;
 }else create();
};
function advanceRecharge(nextStatus,rerender=true){
 const o=campus.recharges.find(o=>o.id===selectedRechargeId);if(!o)return;
 const allowed={processing:['credited','refund_pending'],refund_pending:['refunded']};
 if(!allowed[o.status]?.includes(nextStatus)){toast('订单已处理，无需重复操作');return;}

function powerThresholdSave(){const n=Number(document.getElementById('powerThreshold').value);if(!Number.isFinite(n)||n<1||n>200)return toast('阈值须为1至200度');if(setLife({power:{...life.power,threshold:n}})){render();toast('提醒已保存');}}
editRoom=function(){if(life.power.orders.some(o=>o.status==='pending'))return toast('请先完成等待下发的购电订单');modal('<h2>绑定常用宿舍</h2>'+serviceField('newRoom','楼栋与房间',campus.room,'text','maxlength="40"')+'<p class="muted">更换房间将刷新演示电量，历史购电订单保留。</p>'+serviceButton('保存宿舍','roomSave()'));};
function roomSave(){const room=document.getElementById('newRoom').value.trim();if(!room)return toast('请填写楼栋与房间');if(saveCampus({...campus,room,electricity:room===campus.room?campus.electricity:42.6,life:{...life,power:{...life.power,updated:new Date().toISOString(),online:true}}})){closeModal();render();}}
function powerBuy(){if(life.withdrawal)return toast('离校申请中或已销卡，暂不能购电');const cents=readServiceAmount('powerAmount');if(cents===null)return;if(!life.power.online)return toast('设备离线，请恢复后购电');if(life.power.orders.some(o=>o.status==='pending'))return toast('已有待下发订单，请勿重复购电');confirmDemo('确认购电',campus.room+' · '+money(cents/100),()=>{const reasons=debitProblems(cents);if(reasons.length)return blocked(reasons);const id=lifeID('PWR'),o={id,room:campus.room,cents,status:'pending',created:lifeNow()},op={id,kind:'expense',name:'电费 · '+campus.room,cents,category:'其他',bill:true,date:demoDate,time:campusTime59()};if(saveCampus({...campus,balance:campus.balance-cents,operations:campus.operations.concat(op),life:{...life,power:{...life.power,orders:life.power.orders.concat(o)}}})){refreshExpenseStats();render();toast('扣款成功，等待电量下发');}});}
function powerAdvance(id,status){const o=life.power.orders.find(x=>x.id===id);if(!o||o.status!=='pending'||!['done','failed'].includes(status))return;if(status==='done'&&!life.power.online)return toast('设备离线，暂不能下发');const refund=status==='failed',op={id:'refund-'+id,kind:'refund',name:'购电失败退款 · '+o.room,cents:o.cents,category:'退款',date:demoDate,time:campusTime59()};if(saveCampus({...campus,balance:campus.balance+(refund?o.cents:0),electricity:campus.electricity+(refund?0:o.cents/50),operations:refund?campus.operations.concat(op):campus.operations,life:{...life,power:{...life.power,updated:new Date().toISOString(),orders:life.power.orders.map(x=>x.id===id?{...x,status}:x)}}})){refreshExpenseStats();render();toast(refund?'已退款至校园卡':'电量已到账');}}
function aaPage(){return '<h1>室友电费AA账本</h1><p class="muted">记录分摊，不再次购电、不自动转账；第一位为已垫付的本人。</p>'+serviceButton('选择已到账购电订单','aaChoose()')+(life.splits.length?life.splits.slice().reverse().map(s=>LC(escapeText(s.room),'<p>总金额 '+money(s.cents/100)+' · '+s.orderId+'</p>'+s.members.map((m,i)=>'<div class="row aa-member"><span>'+escapeText(m.name)+' · '+money(m.cents/100)+'<small> '+(m.paid?'已确认':'待支付')+'</small></span>'+(m.paid?'':serviceButton('确认收到',"aaMark('"+s.id+"',"+i+")",false))+'</div>').join('')+'<p class="muted">已确认 '+money(s.members.filter(m=>m.paid).reduce((a,m)=>a+m.cents,0)/100)+'</p>')).join(''):'<div class="empty">暂无分摊单</div>');}
function aaChoose(){const list=life.power.orders.filter(o=>o.status==='done'&&!life.splits.some(s=>s.orderId===o.id));modal('<h2>选择购电订单</h2>'+(list.map(o=>serviceButton(escapeText(o.room)+' · '+money(o.cents/100),"aaNew('"+o.id+"')",false)).join('')||'<p>暂无可分摊订单，已创建的订单不可重复分摊。</p>')+LB('前往购电','宿舍用电管家'));}
function aaNew(id){const o=life.power.orders.find(o=>o.id===id);if(!o||o.status!=='done'||life.splits.some(s=>s.orderId===id))return toast('该订单不可重复分摊');modal('<h2>创建分摊单</h2><p>'+money(o.cents/100)+'</p>'+serviceField('aaNames','参与人（逗号分隔，第一位为本人）','我,室友A,室友B,室友C')+serviceSelect('aaMode','分摊方式',['平均分摊','自定义金额'])+serviceField('aaAmounts','自定义金额（元，按姓名顺序逗号分隔）','','text','placeholder="例如5,5,5,5"')+serviceButton('生成分摊单',"aaSave('"+id+"')"));}
function aaSave(id){const o=life.power.orders.find(o=>o.id===id);if(!o||o.status!=='done'||life.splits.some(s=>s.orderId===id))return;const names=document.getElementById('aaNames').value.split(/[,，]/).map(x=>x.trim());if(names.length<2||names.length>8||names.some(n=>!n||n.length>20)||new Set(names).size!==names.length)return toast('请输入2至8个不重复姓名，每个不超过20字');let amounts;if(document.getElementById('aaMode').value==='平均分摊')amounts=names.map((_,i)=>Math.floor(o.cents/names.length)+(i<o.cents%names.length?1:0));else{const a=document.getElementById('aaAmounts').value.split(/[,，]/).map(x=>x.trim());if(a.length!==names.length||a.some(x=>!/^\d+(\.\d{1,2})?$/.test(x)))return toast('请按姓名数量填写金额，最多两位小数');amounts=a.map(x=>Math.round(Number(x)*100));}if(amounts.some(x=>!Number.isSafeInteger(x)||x<=0)||amounts.reduce((a,b)=>a+b,0)!==o.cents)return toast('各人金额须大于0，合计须等于购电金额');if(setLife({splits:life.splits.concat({id:lifeID('AA'),orderId:id,room:o.room,cents:o.cents,members:names.map((name,i)=>({name,cents:amounts[i],paid:i===0}))})}))service('室友电费AA');}
function aaMark(id,index){const s=life.splits.find(x=>x.id===id);if(!s||!s.members[index]||s.members[index].paid)return;confirmDemo('确认收到分摊款',s.members[index].name+' · '+money(s.members[index].cents/100)+'，请先核对收款。仅更新账本。',()=>{if(setLife({splits:life.splits.map(s=>s.id===id?{...s,members:s.members.map((m,i)=>i===index?{...m,paid:true}:m)}:s)}))render();});}
const lifeOldStart=startDevice;startDevice=function(key){if(life.withdrawal)return toast('离校申请中或已销卡');const before=campus.sessions[key];lifeOldStart(key);if(!before&&campus.sessions[key]){if(saveCampus({...campus,sessions:{...campus.sessions,[key]:{...campus.sessions[key],startedAt:Date.now()}}}))render();}};
function watchText(key,s){const mins=s.startedAt?Math.max(0,Math.floor((Date.now()-s.startedAt)/60000)):null;return (mins===null?'历史会话计时未知':'已使用 '+mins+' 分钟')+' · 预计 '+money(key==='bath'?3.8:0.6)+(mins!==null&&mins>=life.reminder?' · 已达提醒时长，请检查是否需要结束':'');}
function watchCards(){return Object.entries(campus.sessions).map(([k,s])=>LC(escapeText(s.device),'<p>开始 '+escapeText(s.time)+'</p><p data-watch="'+k+'">'+watchText(k,s)+'</p>'+serviceButton('结束使用并结算',"endDevice('"+k+"')")+serviceButton('设备异常，停止并申报',"reportActiveWater('"+k+"')",false))).join('');}

function workPage(){const list=life.tickets.filter(t=>workFilter==='全部'||t.status===workFilter);return '<h1>服务工单中心</h1>'+serviceButton('发起服务工单','workNew()')+LC('已有业务进度',LB('充值到账与原路退款','充值到账追踪')+LB('用水异常与退款','用水异常处理')+LB('购电下发与退款','宿舍用电管家')+LB('卡务办理进度','补卡与解挂'))+'<div class="tabs">'+['全部','已提交','处理中','已完成','已撤销'].map(t=>'<button class="'+(t===workFilter?'active':'')+'" onclick="workFilter=\''+t+'\';render()">'+t+'</button>').join('')+'</div>'+(list.map(t=>'<button class="panel service-wide" onclick="workDetail(\''+t.id+'\')"><div class="row"><strong>'+escapeText(t.type)+'</strong><span class="tag">'+t.status+'</span></div><p>'+escapeText(t.text)+'</p><small>'+t.created+' · '+t.department+'</small></button>').join('')||'<div class="empty">暂无此类工单</div>');}
function workNew(){modal('<h2>发起服务工单</h2>'+serviceSelect('workType','问题类型',['设备维修','消费扣款争议','校园卡服务','其他咨询'])+serviceField('workPlace','位置或交易编号','','text','maxlength="80"')+'<label for="workText">问题描述</label><textarea id="workText" class="service-input" rows="4" maxlength="500"></textarea><p class="muted">此工单不直接触发资金操作；充值和用水问题建议使用关联订单入口。</p>'+LB('充值核查','充值到账追踪')+LB('用水异常','用水异常处理')+serviceButton('提交工单','workSubmit()'));}
function workSubmit(){const type=document.getElementById('workType').value,text=document.getElementById('workText').value.trim(),place=document.getElementById('workPlace').value.trim();if(text.length<5)return toast('请填写至少5个字的问题描述');const t={id:lifeID('TK'),type,text,place,status:'已提交',department:type==='设备维修'?'演示后勤维修组':'演示一卡通服务中心',created:lifeNow(),notes:[],events:[LE('工单已提交')],rating:null};if(setLife({tickets:life.tickets.concat(t)})){service('服务工单中心');workDetail(t.id);}}
function workDetail(id){const t=life.tickets.find(t=>t.id===id);if(!t)return;modal('<h2>'+escapeText(t.type)+' · '+t.status+'</h2><p>'+escapeText(t.text)+'</p><p class="muted">工单 '+t.id+'<br>位置/交易 '+escapeText(t.place||'未填')+'<br>处理部门 '+t.department+'</p>'+recoveryProgress(t.events)+t.notes.map(n=>'<p>'+escapeText(n)+'</p>').join('')+(t.status!=='已撤销'?serviceField('workNote','补充说明 / 再次反馈原因','','text','maxlength="300"')+serviceButton('补充说明',"workAction('"+id+"','note')",false):'')+(t.status==='已提交'?serviceButton('撤销工单',"workAction('"+id+"','cancel')",false):'')+(t.status==='已完成'?serviceSelect('workRating','处理评价',['满意','一般','不满意'])+'<p class="muted">当前评价：'+(t.rating||'未评价')+'</p>'+serviceButton('提交评价',"workAction('"+id+"','rate')",false)+serviceButton('未解决，再次反馈',"workAction('"+id+"','reopen')",false):'')+(['已提交','处理中'].includes(t.status)?'<details class="panel"><summary>演示服务人员处理</summary>'+serviceButton(t.status==='已提交'?'演示：受理工单':'演示：完成处理',"workAction('"+id+"','advance')")+'</details>':''));}
function workAction(id,a){const t=life.tickets.find(t=>t.id===id);if(!t)return;let n={...t};if(a==='note'&&t.status!=='已撤销'){const text=document.getElementById('workNote').value.trim();if(!text)return toast('请填写补充说明');n.notes=t.notes.concat(text);n.events=t.events.concat(LE('用户补充说明'));}else if(a==='cancel'&&t.status==='已提交'){n.status='已撤销';n.events=t.events.concat(LE('用户撤销工单'));}else if(a==='advance'&&['已提交','处理中'].includes(t.status)){n.status=t.status==='已提交'?'处理中':'已完成';n.events=t.events.concat(LE(n.status==='处理中'?'服务人员受理':'服务人员处理完成'));}else if(a==='rate'&&t.status==='已完成')n.rating=document.getElementById('workRating').value;else if(a==='reopen'&&t.status==='已完成'){const text=document.getElementById('workNote').value.trim();if(!text)return toast('请先填写未解决的问题');n.status='处理中';n.rating=null;n.notes=t.notes.concat(text);n.events=t.events.concat(LE('用户再次反馈，重新核查'));}else return;if(setLife({tickets:life.tickets.map(t=>t.id===id?n:t)})){render();workDetail(id);}}
function cardPage(){const c=life.card;return '<h1>补卡与解挂</h1>'+LC('校园卡 · 第'+life.cardVersion+'版','<p>状态：'+(life.withdrawal?'离校办理中 / 已停用':campus.lost?'已挂失':'正常')+'</p><p>余额 '+money(campus.balance/100)+'</p><p class="muted">领取新卡后旧实体卡永久失效，账户余额保留。演示补卡费0元。</p>'+serviceButton(campus.lost?'验证身份并解挂':'立即挂失',campus.lost?'cardVerify(\'unloss\')':'confirmCardStatus()')+(!c||c.status==='已领取'?serviceButton('申请补办新卡','cardApply()',false):''))+(c?LC('补卡进度 · '+c.status,'<p class="muted">编号 '+c.id+'<br>演示一卡通服务中心 · 演示工作日09:00–17:00</p>'+recoveryProgress(c.events)+(c.status==='待受理'?serviceButton('撤销申请','cardAction(\'cancel\')',false)+serviceButton('演示：制卡完成','cardAction(\'ready\')'):c.status==='待领取'?serviceButton('验证身份并领取','cardVerify(\'pickup\')'):'')+LB('查看服务地点','服务地点与设备')):'');}

function cardVerified(a){if(document.getElementById('cardProof').value!==campus.profile.student.slice(-6))return toast('身份校验未通过');if(life.withdrawal)return;if(a==='unloss'){if(saveCampus({...campus,lost:false})){closeModal();render();toast('解挂成功');}}else if(a==='pickup'&&life.card?.status==='待领取'){if(saveCampus({...campus,lost:false,life:{...life,cardVersion:life.cardVersion+1,card:{...life.card,status:'已领取',events:life.card.events.concat(LE('新卡已领取，旧卡已失效，余额保留'))}}})){closeModal();render();}}}
function cardAction(a){const c=life.card;if(!c||life.withdrawal)return;if(a==='cancel'&&c.status==='待受理'){if(setLife({card:null}))render();}else if(a==='ready'&&c.status==='待受理'){if(setLife({card:{...c,status:'待领取',events:c.events.concat(LE('制卡完成，等待领取'))}}))render();}}

function exitApply(){if(life.withdrawal)return;if(exitBlocks().length)return toast('请先处理离校检查中的待办事项');modal('<h2>余额退还及销卡</h2><p>待退 '+money(campus.balance/100)+'</p><p class="muted">仅使用虚构演示账号。提交后暂停资金操作，撤销恢复原状态；完成后校园卡停用。</p>'+serviceField('exitAccount','本人演示银行账号（16至19位）','','text','maxlength="19" inputmode="numeric"')+serviceField('exitProof','身份验证：学号后六位','','password','maxlength="6"')+serviceButton('提交申请','exitSubmit()'));}
function exitSubmit(){if(life.withdrawal||exitBlocks().length)return toast('请重新检查未完成事项');const account=document.getElementById('exitAccount').value.trim();if(!/^\d{16,19}$/.test(account))return toast('请输入16至19位演示账号');if(document.getElementById('exitProof').value!==campus.profile.student.slice(-6))return toast('身份校验未通过');const w={id:lifeID('EXIT'),account,cents:campus.balance,status:'待审核',previousLost:campus.lost,events:[LE('余额退还及销卡申请已提交')]};if(saveCampus({...campus,lost:true,life:{...life,withdrawal:w}})){closeModal();render();}}

</script><script>let taskType='全部',taskState='待处理',taskSearch='',authRequest=null;

function tasks16(){const items=[];const add=(id,type,title,status,done,created,route,action)=>items.push({id,type,title,status,done,created:created||'',route,action});
 campus.recharges.forEach(o=>add(o.id,'充值','充值 '+money(o.cents/100),rechargeLabels[o.status],['credited','refunded'].includes(o.status),o.created,'充值到账追踪',()=>openRechargeOrder(o.id)));

 life.power.orders.forEach(o=>add(o.id,'购电',o.room+' · '+money(o.cents/100),{pending:'等待下发',done:'已到账',failed:'已退款'}[o.status],o.status!=='pending',o.created,'宿舍用电管家'));
 life.tickets.forEach(t=>add(t.id,'工单',t.type+' · '+t.text,t.status,['已完成','已撤销'].includes(t.status),t.created,'服务工单中心',()=>workDetail(t.id)));

 if(life.withdrawal)add(life.withdrawal.id,'离校','余额退还 '+money(life.withdrawal.cents/100),life.withdrawal.status,life.withdrawal.status!=='待审核',life.withdrawal.events[0]?.time,'入学与离校');
 return items.reverse();}

const exitBlocks15=exitBlocks;exitBlocks=function(){const a=[];if(Object.keys(campus.sessions).length)a.push('请先结束正在使用的设备');if(campus.recharges.some(o=>['processing','refund_pending'].includes(o.status)))a.push('请先完成充值到账或原路退款');if(campus.waterTickets.some(t=>t.status!=='resolved'&&!t.deviceOnly))a.push('请先完成涉及扣费的用水核查');if(life.power.orders.some(o=>o.status==='pending'))a.push('请先完成购电下发或退款');if(life.tickets.some(t=>['已提交','处理中'].includes(t.status)&&['消费扣款争议','校园卡服务'].includes(t.type)))a.push('请先完成资金或卡务相关工单');if(life.card&&life.card.status!=='已领取')a.push('请先完成或撤销补卡申请');return a;};

const journeyPage15=journeyPage;journeyPage=function(){let html=journeyPage15();if(life.mode==='毕业离校'){html=html.replace('结清订单与工单后退还余额','结清涉及资金与卡务的事项后退还余额').replace('本原型内无待处理事项','无阻止退还余额的事项');const notes=exitAdvisories16();if(notes.length)html=html.replace('<h2>余额退还与销卡</h2>','<h2>余额退还与销卡</h2><div class="advisory16"><strong>温馨提醒 · 不拦截离校</strong>'+notes.map(n=>'<p>'+n+'</p>').join('')+'</div>');}return html;};

function readLab59(){try{return JSON.parse(localStorage.getItem(labKey59)||'null')||{status:'draft',total:10000,version:1,consent:false,paidA:false,paidB:false,offset:0,events:[]};}catch(_){return {status:'draft',total:10000,version:1,consent:false,events:[]};}}
function saveLab59(lab,label){if(label)lab.events.push(label);localStorage.setItem(labKey59,JSON.stringify(lab));openAALab59();}
function labAction59(action){
  const b=readLab59(),a=labRole59==='initiator';
  if(action==='invite'&&a&&['draft','rejected','invited'].includes(b.status)){
    const value=document.getElementById('labTotal59').value;if(!validAmount(value)||Number(value)<0.02)return toast('请输入至少0.02元');
    Object.assign(b,{total:Math.round(Number(value)*100),status:'invited',consent:false,version:b.version+1});
    saveLab59(b,'发起人发送或修改邀请，舍友需重新确认');return;
  }
  if(!a&&b.status==='invited'){
    if(action==='consent'){b.consent=true;saveLab59(b,'舍友确认份额');return;}
    if(action==='revoke'){b.consent=false;saveLab59(b,'舍友撤回确认，发起人暂停支付');return;}
    if(action==='reject'){b.consent=false;b.status='rejected';saveLab59(b,'舍友拒绝，等待修改');return;}
  }
  if(action==='pay'&&a&&b.status==='invited'&&b.consent){
    b.paidA=true;b.channel=document.getElementById('labChannel59').value;
    b.status=document.getElementById('labDelivery59').value==='success'?'credited':'failed';
    if(b.status==='credited')b.creditedAt=Date.now();saveLab59(b,b.status==='credited'?'发起人付本人份额，宿舍全额到账，3天付款期限开始':'已付本人份额，模拟下发失败，舍友无需付款');return;

  if(action==='retry'&&a&&b.status==='failed'){b.status='credited';b.creditedAt=Date.now();saveLab59(b,'重试成功，不重复扣款');return;}
